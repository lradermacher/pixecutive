<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Figure playground</title>
		<style>
			:root {
				--page: #1f2228;
				--text: #e8e9ec;
				--muted: #9aa0aa;
				--control: #2c3038;
				--line: #454a54;
				--chosen: #e8473a;
				--floor: #e0e8ef;
				--caption: #b8bdc6;
			}
			body {
				margin: 0;
				padding: 16px 20px 24px;
				background: var(--page);
				color: var(--text);
				font:
					14px/1.4 system-ui,
					sans-serif;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 16px;
			}
			code {
				font-size: 15px;
			}
			.controls {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 24px;
				margin-bottom: 14px;
			}
			.group {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.title {
				margin-right: 4px;
			}
			.choice {
				padding: 5px 10px;
				border: 1px solid var(--line);
				border-radius: 4px;
				background: var(--control);
				color: var(--text);
				font: inherit;
				cursor: pointer;
			}
			.choice.chosen {
				border-color: var(--chosen);
				background: var(--chosen);
			}
			.stage {
				display: flex;
				flex-wrap: wrap;
				justify-content: space-around;
				gap: 16px;
				padding: 24px 16px;
				border-radius: 6px;
				background: var(--floor);
			}
			.figure {
				display: flex;
				flex-direction: column;
				align-items: center;
				margin: 0;
			}
			.tile {
				image-rendering: pixelated;
			}
			.caption {
				margin-top: 8px;
				color: #3a3f48;
				font-size: 12px;
			}
			.reason {
				padding: 12px;
				border: 1px solid var(--chosen);
				border-radius: 6px;
				white-space: pre-wrap;
			}
			.warning {
				margin: 0 0 12px;
				color: var(--chosen);
			}
			.warning:empty {
				display: none;
			}
			.note {
				margin-top: 12px;
				color: var(--muted);
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>Office UI playground — base figures from <code>assets/figures/manifest.json</code></h1>
		<script type="module" src="./src/playground/main.ts"></script>
	</body>
</html>
