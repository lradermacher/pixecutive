<title>TITLE: two to four words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800;900&family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Pixecutive decision sheet. Tokens mirror the Pixecutive design system (tokens.json); dark-first, paper as the light theme. */
:root {
  --bg: #121318; --surface: #1B1C23; --surface-2: #25262F;
  --text: #F7F5EF; --muted: #A3A2A8; --border: #33343E; --border-strong: #6E6F78;
  --brand: #E8503B; --on-brand: #121318; --brand-text: #FF8A78;
  --success: #5FCB97; --danger: #FF7B6E; --info: #7FAEFF;
  --display: "Doto", "Geist Mono", ui-monospace, monospace;
  --sans: "Geist", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F7F5EF; --surface: #FFFFFF; --surface-2: #EDEAE2;
  --text: #1C1C22; --muted: #6F6E73; --border: #D9D6CE; --border-strong: #8B8A8F;
  --brand-text: #C23B29; --success: #1B7A52; --danger: #B8322A; --info: #2B63C6; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #F7F5EF; --surface: #FFFFFF; --surface-2: #EDEAE2;
  --text: #1C1C22; --muted: #6F6E73; --border: #D9D6CE; --border-strong: #8B8A8F;
  --brand-text: #C23B29; --success: #1B7A52; --danger: #B8322A; --info: #2B63C6; color-scheme: light }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--text); font: 400 16px/26px var(--sans); margin: 0 }
h1, h2, h3, p, ol, dl, dd { margin: 0 }
ol { padding: 0; list-style: none }
code { font: 450 13px/20px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere }
.eyebrow { font: 500 12px/18px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-top: 3px solid var(--brand); border-bottom: 1px solid var(--border) }
.bar-in { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.bar-left { display: flex; align-items: center; gap: 12px; min-width: 0 }
.bar-left svg { width: 28px; height: 28px; flex: none }
.bar-right { display: flex; gap: 12px; font: 500 12px/18px var(--mono); color: var(--muted); white-space: nowrap }
.bar-right b { color: var(--text); font-weight: 500 }

main { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 96px; display: flex; flex-direction: column; gap: 32px }
.head { display: flex; flex-direction: column; gap: 12px }
.head .eyebrow { color: var(--brand-text) }
.head h1 { font: 800 40px/1.05 var(--display); letter-spacing: -.5px; text-wrap: balance }
.head p { color: var(--muted); max-width: 64ch }
.offline { font: 400 13px/20px var(--mono); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 14px }

.items { display: flex; flex-direction: column; gap: 16px }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px }
.card-head .id { font: 500 13px/20px var(--mono); color: var(--brand-text) }
.card-head h2 { font: 600 18px/26px var(--sans); flex: 1 1 260px; text-wrap: balance }
.badge { font: 550 12px/18px var(--sans); letter-spacing: .2px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--muted); white-space: nowrap }
.badge.done { border-color: var(--success); color: var(--success) }
dl { display: flex; flex-direction: column; gap: 12px }
dt { font: 500 11px/16px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--muted) }
dd { margin-top: 2px; font-size: 15px; line-height: 24px; overflow-wrap: anywhere }
dd.muted { color: var(--muted) }

.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: grid; grid-template-columns: 18px 1fr; gap: 2px 12px; width: 100%; text-align: left; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: inherit; font: inherit; cursor: pointer }
.opt:hover { border-color: var(--border-strong) }
.opt .dot { width: 16px; height: 16px; margin-top: 4px; border-radius: 9999px; border: 2px solid var(--border-strong) }
.opt[aria-checked="true"] { border-color: var(--brand) }
.opt[aria-checked="true"] .dot { border-color: var(--brand); background: radial-gradient(var(--brand) 0 3px, transparent 4px) }
.opt-label { font-weight: 600; font-size: 15px; line-height: 24px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline }
.opt-label .rec { font: 500 12px/18px var(--mono); color: var(--info) }
.opt-detail { grid-column: 2; font-size: 14px; line-height: 22px; color: var(--muted) }

.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
.foot .hint { font-size: 13px; line-height: 20px; color: var(--muted) }
.choices { display: flex; gap: 8px }
.btn { border-radius: 4px; padding: 7px 16px; font: 600 14px/22px var(--sans); cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--text) }
.btn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand) }
textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); border-radius: 4px; padding: 8px 12px; font: 400 14px/22px var(--sans) }
.opt:focus-visible, .btn:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--info); outline-offset: 2px }

section { display: flex; flex-direction: column; gap: 12px }
.decided { background: var(--surface); border: 1px solid var(--border); border-radius: 8px }
.decided details + details { border-top: 1px solid var(--border) }
summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 12px 16px }
summary::-webkit-details-marker { display: none }
summary .id { font: 500 13px/20px var(--mono); color: var(--brand-text); flex: none }
summary .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 24px }
summary .plus { font: 500 14px/20px var(--mono); color: var(--muted); flex: none; transition: transform .15s }
details[open] summary .plus { transform: rotate(45deg) }
.decided .body { padding: 0 16px 16px }
.after li { display: flex; gap: 12px; font-size: 15px; line-height: 24px; color: var(--muted) }
.after li span:first-child { font: 500 13px/24px var(--mono); color: var(--brand-text); flex: none }

@media (max-width: 520px) { .head h1 { font-size: 32px } .card { padding: 16px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

" fill="#F2846F"></polygon><polygon points="97.56595879909108,76.73310711815517 108.29908988454567,82.09966067723276 108.29908988454567,70.09966067723276 97.56595879909108,64.73310711815517" fill="#E8503B"></polygon><polygon points="108.29908988454567,82.09966067723276 119.03222097000025,76.73310711815517 119.03222097000025,64.73310711815517 108.29908988454567,70.09966067723276" fill="#B33A2A"></polygon><polygon points="108.29908988454567,70.09966067723276 119.03222097000025,64.73310711815517 108.29908988454567,59.36655355907759 97.56595879909108,64.73310711815517" fill="#F2846F"></polygon><polygon points="0.9677790299997415,82.09966067723276 11.700910115454334,87.46621423631035 11.700910115454334,75.46621423631035 0.9677790299997415,70.09966067723276" fill="#E8503B"></polygon><polygon points="11.700910115454334,87.46621423631035 22.43404120090893,82.09966067723276 22.43404120090893,70.09966067723276 11.700910115454334,75.46621423631035" fill="#B33A2A"></polygon><polygon points="11.700910115454334,75.46621423631035 22.43404120090893,70.09966067723276 11.700910115454334,64.73310711815517 0.9677790299997415,70.09966067723276" fill="#F2846F"></polygon><polygon points="65.3665655427273,82.09966067723276 76.09969662818189,87.46621423631035 76.09969662818189,75.46621423631035 65.3665655427273,70.09966067723276" fill="#E8503B"></polygon><polygon points="76.09969662818189,87.46621423631035 86.83282771363648,82.09966067723276 86.83282771363648,70.09966067723276 76.09969662818189,75.46621423631035" fill="#B33A2A"></polygon><polygon points="76.09969662818189,75.46621423631035 86.83282771363648,70.09966067723276 76.09969662818189,64.73310711815517 65.3665655427273,70.09966067723276" fill="#F2846F"></polygon><polygon points="86.83282771363649,82.09966067723276 97.56595879909108,87.46621423631035 97.56595879909108,75.46621423631035 86.83282771363649,70.09966067723276" fill="#E8503B"></polygon><polygon points="97.56595879909108,87.46621423631035 108.29908988454567,82.09966067723276 108.29908988454567,70.09966067723276 97.56595879909108,75.46621423631035" fill="#B33A2A"></polygon><polygon points="97.56595879909108,75.46621423631035 108.29908988454567,70.09966067723276 97.56595879909108,64.73310711815517 86.83282771363649,70.09966067723276" fill="#F2846F"></polygon></svg><span class="eyebrow">Decision</span></span>

<main>
  <div class="head">
    <span class="eyebrow">PIX-NNN · TOPIC · YYYY-MM-DD</span>
    <h1>HEADING</h1>
    <p>One to three sentences: what was checked and against what, how many items need the maintainer, and that the rest is decided.</p>
  </div>
  <p class="offline" id="offline" hidden>Saving is not available in this view. Your choices stay visible here only.</p>

  <div class="items" id="items" aria-label="Your items"></div>

  <section aria-label="Decided">
    <h2 class="eyebrow">Decided, for reference</h2>
    <div class="decided" id="decided"></div>
  </section>

  <section aria-label="Next">
    <h2 class="eyebrow">Next</h2>
    <ol class="after" id="after"></ol>
  </section>
</main>

<script>
// Fill ITEMS, ASK, AFTER and COLLECTION. Text fields are plain text; `backticks` become code.
// An item with `options` is a choice between options (mark one `rec: true`); without, it is Yes / Own answer.
// Every asked item also takes an own answer: typing in its field without picking anything is a full answer.
const ITEMS = [
  { id: "F1", kind: "Kind of item",
    title: "One line that states the item",
    what: "The finding with its source: file and line, a measurement or a ticket. Without a source it is a question, not a finding.",
    do: "What I would do, concrete enough that a yes is enough.",
    why: "Why I would do it, and for a question: why it is the maintainer's call." },
  { id: "F2", kind: "Kind of item",
    title: "A choice between options",
    what: "Finding with source.",
    do: "The option I recommend.",
    why: "Why.",
    options: [
      { key: "a", label: "Option A", detail: "What it means.", rec: true },
      { key: "b", label: "Option B", detail: "What it means." } ] },
  { id: "B1", kind: "Kind of item",
    title: "An item I decided",
    what: "Finding with source.",
    do: "What I do or did.",
    why: "Why." },
];
const ASK = ["F1", "F2"];
const AFTER = [
  "What happens after the answers, in the order it happens.",
  "What is deliberately not part of this sheet, and where it lives instead.",
];
const COLLECTION = "sheet-id";

const OWN = { key: "own", label: "My own answer", detail: "None of these; I write my answer in the field below." };
const ASKED = ITEMS.filter((i) => ASK.includes(i.id));
const state = {};
const saveEl = document.getElementById("save-state");
let db = null;

function el(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

function rich(tag, className, text) {
  const n = el(tag, className);
  String(text).split("`").forEach((part, i) => n.append(i % 2 ? el("code", "", part) : document.createTextNode(part)));
  return n;
}

function facts(it, doLabel) {
  const dl = el("dl");
  for (const [label, value, muted] of [["Finding", it.what, false], [doLabel, it.do, false], ["Why", it.why, true]]) {
    const row = el("div");
    row.append(el("dt", "", label), rich("dd", muted ? "muted" : "", value));
    dl.append(row);
  }
  return dl;
}

function render() {
  const host = document.getElementById("items");
  host.textContent = "";
  for (const it of ASKED) {
    const s = state[it.id] || {};
    const card = el("article", "card");
    card.id = "item-" + it.id;
    const head = el("div", "card-head");
    head.append(el("span", "id", it.id), rich("h2", "", it.title), el("span", "badge", it.kind));
    card.append(head, facts(it, it.options ? "I recommend" : "I would"));

    if (it.options) {
      const group = el("div", "opts");
      group.setAttribute("role", "radiogroup");
      group.setAttribute("aria-label", it.id);
      for (const o of it.options.concat([OWN])) {
        const b = el("button", "opt");
        b.type = "button";
        b.id = "opt-" + it.id + "-" + o.key;
        b.setAttribute("role", "radio");
        b.setAttribute("aria-checked", String(s.choice === o.key));
        const label = el("span", "opt-label");
        label.append(rich("span", "", o.label));
        if (o.rec) label.append(el("span", "rec", "recommended"));
        b.append(el("span", "dot"), label);
        if (o.detail) b.append(rich("span", "opt-detail", o.detail));
        b.addEventListener("click", () => choose(it.id, (state[it.id] || {}).choice === o.key ? "" : o.key));
        group.append(b);
      }
      card.append(group);
    }

    const ta = el("textarea");
    ta.id = "note-" + it.id;
    ta.placeholder = "Your own answer, or a note on what you picked";
    ta.setAttribute("aria-label", "Your answer to " + it.id);
    ta.value = s.note || "";
    let t = null;
    ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => saveNote(it.id, ta.value), 700); });
    card.append(ta);

    if (!it.options) {
      const foot = el("div", "foot");
      foot.append(el("span", "hint", "Yes carries out what is under “I would”."));
      const choices = el("div", "choices");
      for (const [val, label] of [["own", "Own answer"], ["yes", "Yes"]]) {
        const b = el("button", "btn", label);
        b.type = "button";
        b.id = "btn-" + it.id + "-" + val;
        b.setAttribute("aria-pressed", String(s.choice === val));
        b.addEventListener("click", () => choose(it.id, (state[it.id] || {}).choice === val ? "" : val));
        choices.append(b);
      }
      foot.append(choices);
      card.append(foot);
    }
    host.append(card);
  }
  updateCount();
}

function renderDecided() {
  const host = document.getElementById("decided");
  host.textContent = "";
  for (const it of ITEMS.filter((i) => !ASK.includes(i.id))) {
    const d = el("details");
    const s = el("summary");
    s.append(el("span", "id", it.id), rich("span", "t", it.title), el("span", "plus", "+"));
    const body = el("div", "body");
    body.append(facts(it, "Decided"));
    d.append(s, body);
    host.append(d);
  }
}

function renderAfter() {
  const host = document.getElementById("after");
  AFTER.forEach((text, i) => {
    const li = el("li");
    li.append(el("span", "", String(i + 1).padStart(2, "0")), rich("span", "", text));
    host.append(li);
  });
}

function updateCount() {
  // An own answer counts only with its text.
  document.getElementById("count").textContent = ASKED.filter((i) => answered(state[i.id])).length;
  document.getElementById("total").textContent = ASKED.length;
}

function answered(s) {
  return Boolean(s && s.choice && (s.choice !== OWN.key || (s.note || "").trim()));
}

function paint(id) {
  const s = state[id] || {};
  for (const b of document.querySelectorAll('[id^="opt-' + id + '-"]')) b.setAttribute("aria-checked", String(b.id === "opt-" + id + "-" + s.choice));
  for (const v of ["yes", "own"]) {
    const b = document.getElementById("btn-" + id + "-" + v);
    if (b) b.setAttribute("aria-pressed", String(s.choice === v));
  }
}

async function write(id) {
  if (!db) return;
  const s = state[id];
  saveEl.textContent = "saving…";
  try {
    await db.doc(COLLECTION + "/" + id).set({ choice: s.choice || "", note: s.note || "", at: new Date().toISOString() });
    saveEl.textContent = "saved";
  } catch (e) {
    saveEl.textContent = e && e.code === "invalid_argument" ? "read-only" : "not saved";
  }
}

function choose(id, choice) {
  state[id] = Object.assign({}, state[id], { choice });
  if (choice === OWN.key) document.getElementById("note-" + id).focus();
  paint(id);
  updateCount();
  write(id);
}

function saveNote(id, note) {
  const cur = state[id] || {};
  // A typed answer without a pick counts as an own answer; an own answer emptied again is withdrawn.
  const choice = cur.choice || OWN.key;
  state[id] = Object.assign({}, cur, { note, choice: choice === OWN.key && !note.trim() ? "" : choice });
  paint(id);
  updateCount();
  write(id);
}

render();
renderDecided();
renderAfter();

(async () => {
  try {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  } catch (e) { db = null; }
  if (!db) {
    saveEl.textContent = "local only";
    document.getElementById("offline").hidden = false;
    return;
  }
  saveEl.textContent = "connected";
  db.collection(COLLECTION).onSnapshot((snap) => {
    for (const d of snap.docs) {
      const data = d.data() || {};
      const active = document.activeElement && document.activeElement.id === "note-" + d.id;
      const cur = state[d.id] || {};
      state[d.id] = { choice: data.choice || "", note: active ? cur.note : (data.note || "") };
      paint(d.id);
      const ta = document.getElementById("note-" + d.id);
      if (ta && !active) ta.value = state[d.id].note;
    }
    updateCount();
  }, () => { saveEl.textContent = "connection lost"; });
})();
</script>
